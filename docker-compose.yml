name: staj-tasks

services:
  erp-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erp_simulator
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports:
      - "5433:5432"
    volumes:
      - erp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_simulator"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - erp-data

  erp-simulator:
    build: ./erp-simulator
    ports:
      - "5080:8080"
    environment:
      ConnectionStrings__ErpDb: "Host=erp-db;Database=erp_simulator;Username=erp;Password=erp;GSS Encryption Mode=Disable"
      # Optional overrides, passed through from the shell only when set there
      # (e.g. `Simulator__Rates__Success=0 Simulator__Rates__Busy=100 ... docker compose up -d erp-simulator`; rates must add up to 100).
      Simulator__Seed:
      Simulator__Rates__Success:
      Simulator__Rates__Busy:
      Simulator__Rates__ServerError:
      Simulator__Rates__SaveThenError:
      Simulator__Rates__LateResponse:
      Simulator__LateResponseDelaySeconds:
      Simulator__RetryAfterFormat:
    volumes:
      # Settings file is mounted so rates can be changed without rebuilding; restart the container to apply.
      - ./erp-simulator/src/ErpSimulator/appsettings.json:/app/appsettings.json:ro
    networks:
      - erp-data
      - apps
    depends_on:
      erp-db:
        condition: service_healthy

  # Fatura Servisi'nin kendi veritabanı: ayrı container, ayrı kullanıcı/şifre, ayrı ağ.
  # Simülatör bu veritabanının bağlantı bilgisini bilmez (Fatura Servisi de erp-db'ninkini).
  invoice-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: invoice_service
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
    ports:
      - "5434:5432"
    volumes:
      - invoice-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_service"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - invoice-data

  invoice-service:
    build: ./invoice-service
    ports:
      - "5090:8080"
    environment:
      ConnectionStrings__InvoiceDb: "Host=invoice-db;Database=invoice_service;Username=invoice;Password=invoice;GSS Encryption Mode=Disable"
      Erp__BaseUrl: "http://erp-simulator:8080"
    networks:
      - invoice-data
      - apps
    # No depends_on erp-simulator on purpose: the service must start (and record failures) even when the ERP is down.
    depends_on:
      invoice-db:
        condition: service_healthy

  # A second copy of the invoice service on the same database, only for the two-copies test
  # (manual-tests/gun3/7-iki-kopya.ps1). It is in a profile, so a plain `docker compose up` does not start it:
  #   docker compose --profile iki-kopya up -d invoice-service-2
  invoice-service-2:
    build: ./invoice-service
    profiles: ["iki-kopya"]
    ports:
      - "5091:8080"
    environment:
      ConnectionStrings__InvoiceDb: "Host=invoice-db;Database=invoice_service;Username=invoice;Password=invoice;GSS Encryption Mode=Disable"
      Erp__BaseUrl: "http://erp-simulator:8080"
    networks:
      - invoice-data
      - apps
    depends_on:
      invoice-db:
        condition: service_healthy

networks:
  # Each database sits on its own network, so the other application cannot even resolve its name; the two
  # applications talk over "apps". This does not block traffic by IP on every Docker host (it does not on Docker
  # Desktop): what keeps the databases apart is that each application only has its own database's connection
  # string and credentials.
  erp-data:
  invoice-data:
  apps:

volumes:
  erp-db-data:
  invoice-db-data:
