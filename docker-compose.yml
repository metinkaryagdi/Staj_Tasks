name: staj-tasks

# Every published port is bound to 127.0.0.1: the browser and the scripts on this computer reach them, other machines on
# the network do not (a plain "5434:5432" would listen on every interface).
services:
  erp-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erp_simulator
      POSTGRES_USER: erp
      # Passwords and secrets come from .env (example: .env.example; .env is not in git). Without a value compose does
      # not start. The password is set when the volume is created; an older volume keeps its old one (see README).
      POSTGRES_PASSWORD: ${ERP_DB_PASSWORD:?.env dosyasında ERP_DB_PASSWORD yok (bkz. .env.example)}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - erp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_simulator"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - erp-data

  # Migrations run here, once, as the database's owner (erp); then the step creates erp_app, the user the simulator
  # connects as, which can only read and write rows. The simulator starts after this step has finished successfully.
  erp-migrate:
    build: ./erp-simulator
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__ErpDb: "Host=erp-db;Database=erp_simulator;Username=erp;Password=${ERP_DB_PASSWORD:?};GSS Encryption Mode=Disable"
      AppDatabaseUser__Password: ${ERP_DB_APP_PASSWORD:?.env dosyasında ERP_DB_APP_PASSWORD yok (bkz. .env.example)}
    networks:
      - erp-data
    depends_on:
      erp-db:
        condition: service_healthy

  erp-simulator:
    build: ./erp-simulator
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      # Container settings (database, invoice service address) are in appsettings.Docker.json, read on top of
      # appsettings.json.
      ASPNETCORE_ENVIRONMENT: Docker
      # The database password and the webhook secret come from .env, not from a file in the repository. The simulator
      # connects as erp_app (rows only), not as the database's owner.
      ConnectionStrings__ErpDb: "Host=erp-db;Database=erp_simulator;Username=erp_app;Password=${ERP_DB_APP_PASSWORD:?};GSS Encryption Mode=Disable"
      Webhooks__Secret: ${ERP_WEBHOOK_SECRET:?.env dosyasında ERP_WEBHOOK_SECRET yok (bkz. .env.example)}
      # Optional overrides, passed through from the shell only when set there (e.g.
      # `Simulator__Rates__Success=0 Simulator__Rates__Busy=100 ... docker compose up -d erp-simulator`; rates must
      # add up to 100).
      Simulator__Seed:
      Simulator__Rates__Success:
      Simulator__Rates__Busy:
      Simulator__Rates__ServerError:
      Simulator__Rates__SaveThenError:
      Simulator__Rates__LateResponse:
      Simulator__LateResponseDelaySeconds:
      Simulator__RetryAfterFormat:
      Simulator__IdempotentInvoices:
      Simulator__ProcessingMinMilliseconds:
      Simulator__ProcessingMaxMilliseconds:
      RateLimit__PermitsPerSecond:
      # Optional overrides of the event problem rates (e.g. all 0 for a run without event problems), passed through
      # like the ones above.
      Webhooks__Enabled:
      Webhooks__ApprovalRate:
      Webhooks__FirstEventMinSeconds:
      Webhooks__FirstEventMaxSeconds:
      Webhooks__SecondEventMinSeconds:
      Webhooks__SecondEventMaxSeconds:
      Webhooks__RetryDelaysSeconds__0:
      Webhooks__RetryDelaysSeconds__1:
      Webhooks__RetryDelaysSeconds__2:
      Webhooks__RetryDelaysSeconds__3:
      Webhooks__RetryDelaysSeconds__4:
      Webhooks__Problems__DuplicateRate:
      Webhooks__Problems__OrderMixRate:
      Webhooks__Problems__LostDecisionRate:
      Webhooks__Problems__FakeRate:
      Webhooks__Problems__ReplayRate:
    volumes:
      # Settings file is mounted so rates can be changed without rebuilding; restart the container to apply.
      - ./erp-simulator/src/ErpSimulator.Api/appsettings.json:/app/appsettings.json:ro
      - ./erp-simulator/src/ErpSimulator.Api/appsettings.Docker.json:/app/appsettings.Docker.json:ro
    networks:
      - erp-data
      - apps
    depends_on:
      erp-migrate:
        condition: service_completed_successfully

  # Fatura Servisi'nin kendi veritabanı: ayrı container, ayrı kullanıcı/şifre, ayrı ağ.
  # Simülatör bu veritabanının bağlantı bilgisini bilmez (Fatura Servisi de erp-db'ninkini).
  invoice-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: invoice_service
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: ${INVOICE_DB_PASSWORD:?.env dosyasında INVOICE_DB_PASSWORD yok (bkz. .env.example)}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - invoice-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_service"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - invoice-data

  # Migrations run here, once, as the database's owner (invoice); then the step creates invoice_app, the user both
  # service copies connect as, which can only read and write rows. The service starts after this step has finished
  # successfully.
  invoice-migrate:
    build: ./invoice-service
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__InvoiceDb: "Host=invoice-db;Database=invoice_service;Username=invoice;Password=${INVOICE_DB_PASSWORD:?};GSS Encryption Mode=Disable"
      AppDatabaseUser__Password: ${INVOICE_DB_APP_PASSWORD:?.env dosyasında INVOICE_DB_APP_PASSWORD yok (bkz. .env.example)}
    networks:
      - invoice-data
    depends_on:
      invoice-db:
        condition: service_healthy

  invoice-service:
    build: ./invoice-service
    ports:
      - "127.0.0.1:5090:8080"
    environment:
      # Container settings (database, ERP simulator address) are in appsettings.Docker.json, read on top of
      # appsettings.json.
      ASPNETCORE_ENVIRONMENT: Docker
      # The database password and the webhook secret come from .env, not from a file in the repository. The service
      # connects as invoice_app (rows only), not as the database's owner.
      ConnectionStrings__InvoiceDb: "Host=invoice-db;Database=invoice_service;Username=invoice_app;Password=${INVOICE_DB_APP_PASSWORD:?};GSS Encryption Mode=Disable"
      ErpWebhooks__Secret: ${ERP_WEBHOOK_SECRET:?}
      # Optional overrides of the reconciliation settings, passed through from the shell only when set there
      # (e.g. IntervalMinutes=1 to see the scheduled runs quickly).
      Reconciliation__IntervalMinutes:
      Reconciliation__LookbackHours:
      Reconciliation__StuckAfterMinutes:
      Reconciliation__UnknownEventAfterMinutes:
      Reconciliation__NoDecisionAfterMinutes:
      Reconciliation__NotFoundRecheckHours:
    networks:
      - invoice-data
      - apps
    # No depends_on erp-simulator on purpose: the service must start (and record failures) even when the ERP is down.
    depends_on:
      invoice-migrate:
        condition: service_completed_successfully

  # Operasyon ekranı: tarayıcıda çalışan statik uygulama (nginx). Yalnızca Fatura Servisi'nin API'siyle konuşur; istekleri
  # kullanıcının tarayıcısı yaptığı için servise host üzerindeki adresinden gider (VITE_API_URL), container ağından değil.
  operations-ui:
    build:
      context: ./operations-ui
      args:
        # Fatura Servisi'nin tarayıcıdan görünen adresi; derleme sırasında koda gömülür. Değiştirince
        # `docker compose up -d --build operations-ui`.
        VITE_API_URL: http://localhost:5090
        # Keycloak'ın tarayıcıdan görünen adresi: kullanıcı giriş için buraya yönlendirilir, token buradan alınır.
        VITE_KEYCLOAK_URL: http://localhost:8080
    ports:
      - "127.0.0.1:5100:80"

  # Kimlik doğrulama: kullanıcılar ve servisler token'ı buradan alır; Fatura Servisi token'ı buranın yayımladığı anahtarlarla
  # (JWKS) doğrular. Realm (roller, client'lar, test kullanıcıları) açılışta keycloak/ klasöründeki dosyadan kurulur. Realm
  # zaten varsa dosya okunmaz: dosyadaki bir değişiklik için container yeniden yaratılır
  # (docker compose up -d --force-recreate keycloak). Yönetim konsolu http://localhost:8080 (admin, şifre .env'deki
  # KEYCLOAK_ADMIN_PASSWORD).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?.env dosyasında KEYCLOAK_ADMIN_PASSWORD yok (bkz. .env.example)}
      # The order system client's secret: keycloak/fatura-realm.json reads it as ${ORDER_SYSTEM_CLIENT_SECRET} when the
      # realm is imported.
      ORDER_SYSTEM_CLIENT_SECRET: ${ORDER_SYSTEM_CLIENT_SECRET:?.env dosyasında ORDER_SYSTEM_CLIENT_SECRET yok (bkz. .env.example)}
      # The test users' passwords, read the same way (${TEST_..._PASSWORD} in the realm file).
      TEST_IZLEYICI_PASSWORD: ${TEST_IZLEYICI_PASSWORD:?.env dosyasında TEST_IZLEYICI_PASSWORD yok (bkz. .env.example)}
      TEST_OPERATOR_PASSWORD: ${TEST_OPERATOR_PASSWORD:?.env dosyasında TEST_OPERATOR_PASSWORD yok (bkz. .env.example)}
      TEST_ROLSUZ_PASSWORD: ${TEST_ROLSUZ_PASSWORD:?.env dosyasında TEST_ROLSUZ_PASSWORD yok (bkz. .env.example)}
      # The monitoring gateway's client secret (izleme-girisi), read the same way.
      MONITORING_CLIENT_SECRET: ${MONITORING_CLIENT_SECRET:?.env dosyasında MONITORING_CLIENT_SECRET yok (bkz. .env.example)}
      # Token'lara yazılan issuer, isteğin hangi adresten geldiğine bakılmaksızın hep bu. Bilgisayardaki script'ler
      # localhost:8080'den, servisler ağın içinden keycloak:8080'den ulaşır; iki adres iki farklı issuer üretmesin.
      KC_HOSTNAME: http://localhost:8080
      # JWKS ve token adresleri isteğin geldiği adrese göre verilir: Fatura Servisi anahtarları keycloak:8080'den alır.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks:
      - apps

  # A second copy of the invoice service on the same database, only for the two-copies tests (manual-tests).
  # It is in a profile, so a plain `docker compose up` does not start it:
  #   docker compose --profile iki-kopya up -d --build invoice-service-2
  # --build is needed: a plain `docker compose up --build` does not build this profile's service.
  invoice-service-2:
    build: ./invoice-service
    profiles: ["iki-kopya"]
    ports:
      - "127.0.0.1:5091:8080"
    environment:
      # Container settings (database, ERP simulator address) are in appsettings.Docker.json, read on top of
      # appsettings.json.
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__InvoiceDb: "Host=invoice-db;Database=invoice_service;Username=invoice_app;Password=${INVOICE_DB_APP_PASSWORD:?};GSS Encryption Mode=Disable"
      ErpWebhooks__Secret: ${ERP_WEBHOOK_SECRET:?}
      # Optional overrides of the reconciliation settings, passed through from the shell only when set there
      # (e.g. IntervalMinutes=1 to see the scheduled runs quickly).
      Reconciliation__IntervalMinutes:
      Reconciliation__LookbackHours:
      Reconciliation__StuckAfterMinutes:
      Reconciliation__UnknownEventAfterMinutes:
      Reconciliation__NoDecisionAfterMinutes:
      Reconciliation__NotFoundRecheckHours:
    networks:
      - invoice-data
      - apps
    depends_on:
      invoice-migrate:
        condition: service_completed_successfully

  # Yük testi (load-test/invoices.js): k6, sabit sürümlü imajla ve bu ağın içinden çalışır, kurulum gerekmez. Profilde
  # olduğu için `docker compose up` başlatmaz; tek komut:
  #   docker compose run --rm k6
  # Sonuç load-test/results/<RUN_ID>.json'a yazılır.
  k6:
    image: grafana/k6:1.3.0
    profiles: ["yuk-testi"]
    command: ["run", "--quiet", "/scripts/invoices.js"]
    environment:
      # İsteğe bağlı, yalnızca kabukta verilirse geçer (açıklamaları load-test/invoices.js'te).
      BASE_URLS:
      RATE:
      DURATION:
      RUN_ID:
      # The order system's secret, for the token the load test takes.
      ORDER_SYSTEM_CLIENT_SECRET: ${ORDER_SYSTEM_CLIENT_SECRET:?}
    volumes:
      - ./load-test:/scripts:ro
      - ./load-test/results:/results
    networks:
      - apps

  # Metrikler, izler, pano ve alarmlar. Servisler metriklerini OTLP ile otel-collector-metrics'e, izlerini otel-collector'a
  # gönderir; izler örneklenip Jaeger'a gider. Prometheus metrikleri otel-collector-metrics'ten toplar ve alarm kurallarını
  # değerlendirir, Alertmanager alarmları alert-receiver'a iletir, Grafana panoyu gösterir. Ayarlar ve pano monitoring/
  # altındadır.
  # İz Collector'ı. Collector'ın contrib imajı: izlerin örneklenmesi (tail_sampling) yalnız onda var.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    # Container'ın bellek sınırı; aşılırsa Collector öldürülür. Collector'ın kendi sınırı (memory_limiter, config.yaml) bunun
    # altında tutulur ki Collector önce veri reddetsin; biri değişirse diğeri de değişmelidir.
    mem_limit: 2048m
    volumes:
      - ./monitoring/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - apps

  # Metrik Collector'ı: ayrı bir süreç ve ayrı bellek sınırı, izlerin yükünden etkilenmez. İz Collector'ıyla aynı imaj ve
  # sürüm: güncellenecek tek Collector sürümü kalır.
  otel-collector-metrics:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    # Container'ın bellek sınırı; Collector'ın kendi sınırı (memory_limiter, config.yaml) bunun altında tutulur, biri
    # değişirse diğeri de değişmelidir.
    mem_limit: 256m
    volumes:
      - ./monitoring/otel-collector-metrics/config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - apps

  # İzler: Collector izleri Jaeger'a iletir. Arayüz http://localhost:16686 (izleme-girisi üzerinden); servis, fatura
  # numarası (invoice.number) ya da trace_id ile aranır. İzler bellekte tutulur: Jaeger yeniden başlayınca silinir.
  # Prometheus, Alertmanager ve Jaeger'ın portları yayımlanmaz: bilgisayardan yalnız izleme-girisi'nden ulaşılır.
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    networks:
      - apps

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    networks:
      - apps

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    networks:
      - apps

  # Prometheus (9090), Alertmanager (9093) ve Jaeger'ın (16686) önündeki giriş kapısı: adresler aynı, her istek önce
  # oauth2-proxy'ye sorulur, yalnız Keycloak'ta fatura-operatoru rolü olan geçer. Araçların CORS başlıkları cevaptan
  # silinir. Ayar monitoring/izleme-girisi/.
  izleme-girisi:
    image: nginx:1.31.8-alpine
    ports:
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9093:9093"
      - "127.0.0.1:16686:16686"
    volumes:
      - ./monitoring/izleme-girisi/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./monitoring/izleme-girisi/snippets:/etc/nginx/snippets:ro
    networks:
      - apps
    depends_on:
      - oauth2-proxy
      - prometheus
      - alertmanager
      - jaeger

  # izleme-girisi'nin sorduğu oturum kontrolü (auth_request). Giriş Keycloak'ın izleme-girisi client'ıyla yapılır
  # (Authorization Code + PKCE); oturum şifreli bir çerezde tutulur. Script'ler bu client'tan alınmış token'ı Bearer ile
  # gönderebilir (audience izleme-girisi; API'nin token'ı burada geçmez).
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: izleme-girisi
      OAUTH2_PROXY_CLIENT_SECRET: ${MONITORING_CLIENT_SECRET:?}
      # Oturum çerezini şifreleyen anahtar: 32 karakter.
      OAUTH2_PROXY_COOKIE_SECRET: ${MONITORING_COOKIE_SECRET:?.env dosyasında MONITORING_COOKIE_SECRET yok (bkz. .env.example)}
      # Tarayıcı Keycloak'a localhost:8080'den, oauth2-proxy compose ağından keycloak:8080'den ulaşır; token'daki issuer
      # her durumda localhost:8080 (KC_HOSTNAME). Keşif belgesi bu yüzden okunmaz, adresler tek tek verilir.
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://localhost:8080/realms/fatura
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: http://localhost:8080/realms/fatura/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/fatura/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/fatura/protocol/openid-connect/certs
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # Yalnız bu Keycloak rolü geçer; rolü olmayan kullanıcı ya da token 403 alır.
      OAUTH2_PROXY_ALLOWED_ROLES: fatura-operatoru
      # Kullanıcılar e-postayla değil rolle ayrılır; test kullanıcılarının e-postası doğrulanmamış.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "true"
      # Bütün trafik HTTP (O5): çerez Secure olursa tarayıcı onu geri göndermez. SameSite=Lax: başka bir sitenin
      # sayfasından gelen istekte çerez gönderilmez.
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      # Oturum dakikada bir Keycloak'ta yenilenir: Keycloak oturumu kapanınca (çıkış, kullanıcı kapatılması) en geç 1 dk
      # sonra buradaki oturum da biter. En uzun süre Keycloak'ın oturum sınırıyla aynı (ssoSessionMaxLifespan, 10 saat);
      # varsayılan 7 gün olurdu.
      OAUTH2_PROXY_COOKIE_REFRESH: 1m
      OAUTH2_PROXY_COOKIE_EXPIRE: 10h
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # Girişten sonra yalnız bu bilgisayardaki adreslere dönülür (üç port).
      OAUTH2_PROXY_WHITELIST_DOMAINS: "localhost:*"
      # Yalnız oturum kontrolü yapar; isteği araca nginx iletir.
      OAUTH2_PROXY_UPSTREAMS: static://202
    networks:
      - apps

  # Alertmanager'ın webhook bildirimlerini alıp her alarmı loglar: docker compose logs -f alert-receiver
  alert-receiver:
    build: ./alert-receiver
    networks:
      - apps

  # Pano ve veri kaynağı açılışta monitoring/grafana'dan yüklenir. Pano için giriş gerekir: admin, şifre .env'deki
  # GRAFANA_ADMIN_PASSWORD. Grafana'nın verisi container'ın içindedir: şifre container her yaratıldığında bu değerden kurulur.
  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env dosyasında GRAFANA_ADMIN_PASSWORD yok (bkz. .env.example)}
      # Anonymous viewers are off: a viewer can send any query to the Prometheus data source through Grafana, which would
      # bypass the login in front of Prometheus.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fatura-servisi.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - apps
    depends_on:
      - prometheus

networks:
  # Each database sits on its own network, so the other application cannot even resolve its name; the two
  # applications talk over "apps". This does not block traffic by IP on every Docker host (it does not on Docker
  # Desktop): what keeps the databases apart is that each application only has its own database's connection
  # string and credentials.
  erp-data:
  invoice-data:
  apps:

volumes:
  erp-db-data:
  invoice-db-data:
