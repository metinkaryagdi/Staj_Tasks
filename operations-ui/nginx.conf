server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Dosya adlarında içerik özeti var (index-AbC123.js): değişen dosyanın adı da değişir, bu yüzden uzun süre saklanabilir.
    # Olmayan bir dosya 404 olur; yoksa tarayıcı eski bir sayfanın aradığı dosya yerine index.html alıp bozuk açılırdı.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tek sayfa uygulama: bilinmeyen yollar index.html'e düşer, yönlendirmeyi tarayıcıdaki uygulama yapar.
    # index.html her açılışta sunucuya sorulur: yeni sürümde asset adları değişir ve tarayıcı eskisini kullanmamalı.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
