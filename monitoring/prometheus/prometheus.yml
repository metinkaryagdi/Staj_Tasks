# Prometheus metrikleri OpenTelemetry Collector'dan 5 saniyede bir toplar; uygulamalar metriklerini Collector'a gönderir
# (monitoring/otel-collector/config.yaml). Fatura Servisi'nin veritabanından okunan değerleri (kuyruk, durum sayıları,
# takılı fatura, son mutabakat) servis 15 saniyede bir okur; arada gelen gönderimler son okumayı taşır.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Collector her metriği gönderen servisin adıyla (job=invoice-service, erp-simulator) ve kopyasıyla (instance) sunar.
  # honor_labels bu etiketleri korur; yoksa Prometheus hepsine job=otel-collector yazardı. invoice-service-2 (iki kopya
  # testleri) de aynı Collector'a gönderdiği için ayrıca hedef gerekmez.
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
