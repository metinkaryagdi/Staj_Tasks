# Prometheus, Alertmanager ve Jaeger'ın önündeki giriş kapısı. Araçlara bilgisayardan yalnız buradan ulaşılır (kendi
# portları yayımlanmaz); adresler aynı kalır: 9090, 9093, 16686. Her istek önce oauth2-proxy'ye sorulur (auth_request):
#   - Tarayıcıda oturum yoksa Keycloak'ın giriş sayfasına gidilir; girişten sonra çerez her üç adreste de geçerlidir
#     (çerez porta bağlı değildir).
#   - Script'ler izleme-girisi client'ından alınmış token'ı Authorization: Bearer ile gönderir.
#   - Yalnız fatura-operatoru rolü geçer: rolü olmayan kullanıcı girişten sonra 403 alır, rolü olmayan token'la gelen istek
#     girişe yönlendirilir (302).
# Compose ağının içinden (Grafana → Prometheus, Prometheus → Alertmanager) araçlara doğrudan ulaşılır, oraya giriş konmaz.

server {
    listen 9090;
    include /etc/nginx/snippets/oauth2.inc;
    location / {
        include /etc/nginx/snippets/korunan.inc;
        proxy_pass http://prometheus:9090;
    }
}

server {
    listen 9093;
    include /etc/nginx/snippets/oauth2.inc;
    location / {
        include /etc/nginx/snippets/korunan.inc;
        proxy_pass http://alertmanager:9093;
    }
}

server {
    listen 16686;
    include /etc/nginx/snippets/oauth2.inc;
    location / {
        include /etc/nginx/snippets/korunan.inc;
        proxy_pass http://jaeger:16686;
    }
}
