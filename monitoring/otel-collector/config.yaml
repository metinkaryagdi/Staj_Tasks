# İz Collector'ı: iki uygulama izlerini OTLP ile buraya gönderir; izler örneklenip Jaeger'a iletilir. Metrikler buraya
# gelmez, ayrı bir Collector'a gider (monitoring/otel-collector-metrics/config.yaml): izlerin yükü bu Collector'ı veri
# reddetmeye zorlasa bile metrikler ve alarmlar etkilenmez.
# Değiştirdikten sonra `docker compose restart otel-collector`.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Collector'ın bellek sınırı. Bellek her check_interval'da ölçülür. limit_mib - spike_limit_mib (yumuşak sınır) aşılınca
  # gelen veri reddedilir: uygulamalar hata alır, reddedilen span'ler kaybolur. limit_mib (sert sınır) aşılınca ayrıca
  # çöp toplama zorlanır. Bellek yumuşak sınırın altına inince veri yeniden kabul edilir. Reddetmek yalnız yeni gelen
  # veriyi durdurur: tail_sampling'in tuttuğu izler kararları verilene kadar bellekte kalır.
  # Değerler docker-compose.yml'deki container sınırına (mem_limit: 2048m) göre seçildi. limit_mib bunun ~%80'i; kalan
  # ~450 MiB, Collector'ın ölçülen belleğinin dışında kalan kısmı (Go çalışma zamanı, dosyalar) içindir, container sınırı
  # aşılırsa Collector öldürülür ve bellekteki bütün izler kaybolur. spike_limit_mib, iki ölçüm arasındaki artış payıdır
  # (limit_mib'in %25'i).
  # Container sınırı değişirse bu ikisi de aynı oranlarla değiştirilmelidir.
  memory_limiter:
    check_interval: 1s
    limit_mib: 1600
    spike_limit_mib: 400

  # İzlerin örneklenmesi (tail sampling): uygulamalar kaydettikleri bütün izleri gönderir, saklanıp saklanmayacağına
  # burada, izin span'leri geldikten sonra karar verilir. Bir faturanın sorunlu olup olmadığı ancak denemeleri yapılınca
  # belli olur; karar bu yüzden uygulamada (ilk span'de) değil burada verilir. Bir faturanın yolculuğu, worker kaydı
  # kuyruktan ilk aldığı anda başlar (ilk adım, oluşturulmadan o ana kadarki kuyruk beklemesidir, geriye tarihli) ve
  # denemeleri, ERP haberleri, düzeltme ve yeniden gönderimle tek trace'tir; karar bütün yolculuğa birlikte uygulanır.
  # Oluşturma isteği kendi trace'idir.
  tail_sampling:
    # Bir trace'in ilk span'i geldikten sonra karar için beklenen süre. Sorunsuz bir faturanın kuyruktan ilk alınmasından
    # gönderilmesine (1. ya da 2. denemede) kadar geçen süreyi kapsamalı: o ana kadar 3. deneme gerekip gerekmediği belli
    # olur. İlk alınmadan önceki kuyruk beklemesi bu süreye girmez; 2. denemenin kuyrukta beklemesi girer.
    # Süre yetmezse fatura aşağıdaki ihtiyat kuralıyla saklanır: sorunlu fatura kaybolmaz, sorunsuz oranı %10'un üstüne
    # çıkar.
    # 2 dakika: bir deneme (sor, gönder, son kez sor) en çok 3 x Erp:TimeoutSeconds (30 sn) sürer, iki deneme arasındaki
    # bekleme en çok ERP'nin Retry-After'ı kadardır (simülatörde en çok 30 sn; 500 ve zaman aşımında birkaç saniye) ve
    # zamanı gelen deneme kuyruktaki yeni faturaların önüne geçer (kayıtlar kuyruğa giriş sırasıyla alınır). 2. denemede
    # gönderilen fatura bu yüzden kuyruk ne kadar dolu olursa olsun ilk alınmasından yaklaşık 1,5 dakikada gönderilmiş olur;
    # kalan pay boş bir gönderim yerinin beklenmesi ve span'lerin uygulamadan gelme gecikmesi içindir.
    # Erp:TimeoutSeconds ya da Retry-After büyürse ya da kuyruğun sırası değişirse süre de gözden geçirilmelidir.
    # Bedeli bellek: bu süre boyunca gelen bütün span'ler Collector'da tutulur.
    decision_wait: 2m
    # Bellekte aynı anda tutulan en fazla trace; dolarsa en eskiler kararsız atılır. decision_wait boyunca oluşan bütün
    # trace'leri tutmalı: faturaların oluşturma istekleri ve faturaların izleri. Worker'ların sorguları uygulamalarda
    # kaydedilmez, buraya gelmez. Varsayılanın (50.000) iki katı pay olarak seçildi.
    num_traces: 100000
    # Karar verilip bellekten çıkmış trace'lere sonradan gelen span'ler (geç gelen ERP haberleri, karar süresinden uzun
    # süren faturaların sonraki denemeleri) aynı karara uyar: saklanan faturanınki saklanır, atılanınki atılır. Kapalı
    # olsaydı geç span yeni bir trace gibi değerlendirilir, atılmış bir faturanın yalnız bir parçası saklanabilirdi.
    # num_traces'ten büyük olmalı ki kararlar span'lerden uzun hatırlansın.
    decision_cache:
      sampled_cache_size: 500000
      non_sampled_cache_size: 500000
    # Politikalardan biri "sakla" derse trace saklanır; hiçbiri demezse atılır. Fatura numarası (invoice.number)
    # taşımayan trace'ler (bir faturayla ilgili olmayan istekler) hiçbir politikaya uymaz, saklanmaz.
    policies:
      # 1) Kalıcı olarak Başarısız olan ve henüz gönderilmemiş faturalar: trace'te sonucu "Sent" olan bir deneme yoksa
      #    saklanır. Başarısız faturalar buraya girer. İhtiyat kuralı da budur: karar anında fatura henüz denenmemiş
      #    ya da denemesi sürüyorsa, ileride sorunlu çıkabileceği için saklanır. Oluşturma isteğinin trace'i de gönderim
      #    içermediği için buraya girer: her faturanınki saklanır, Jaeger'da fatura numarasıyla bulunur. Oluşturma anında
      #    faturanın sorunlu olup olmayacağı bilinmez; yüzdeyle saklansaydı sorunlu faturaların oluşturma isteği
      #    kaybolabilirdi.
      - name: gonderilmemis-ya-da-basarisiz
        type: and
        and:
          and_sub_policy:
            - name: fatura-izi
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span: ['attributes["invoice.number"] != nil']
            - name: gonderildi-yok
              type: string_attribute
              string_attribute: { key: outbox.outcome, values: [Sent], invert_match: true }
      # 2) En az 3 kez denenen faturalar: 3. ya da sonraki bir denemenin span'i varsa saklanır.
      - name: en-az-3-deneme
        type: numeric_attribute
        numeric_attribute: { key: outbox.attempt, min_value: 3 }
      # 3) Sorunsuz faturalar: 1. ya da 2. denemede gönderilen faturaların izlerinin bu yüzdesi saklanır (trace ID'ye
      #    göre).
      - name: sorunsuz-ornek
        type: and
        and:
          and_sub_policy:
            - name: fatura-izi
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span: ['attributes["invoice.number"] != nil']
            - name: oran
              type: probabilistic
              probabilistic:
                # Saklanan sorunsuz fatura oranı, yüzde.
                sampling_percentage: 10

exporters:
  # Saklanmasına karar verilen izler Jaeger'a gider. Jaeger compose ağında, TLS'siz.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  # Collector'ın kendi metrikleri compose ağında :8888/metrics adresinde; Prometheus bunları da toplar (job=otel-collector).
  # Örneklemenin kaç trace sakladığı ve attığı (otelcol_processor_tail_sampling_global_count_traces_sampled,
  # sampled="true"/"false") ve bellek sınırı yüzünden reddedilen span'ler (otelcol_receiver_refused_spans_total,
  # CollectorIzReddediyor alarmı) buradan okunur.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling]
      exporters: [otlp/jaeger]
