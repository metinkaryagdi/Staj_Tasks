# OpenTelemetry Collector: iki uygulama metriklerini ve izlerini OTLP ile buraya gönderir. Metrikler (5 saniyede bir)
# Prometheus biçiminde :8889/metrics adresinde sunulur ve Prometheus oradan toplar; izler örneklenip Jaeger'a iletilir.
# Değiştirdikten sonra `docker compose restart otel-collector`.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # İzlerin örneklenmesi (tail sampling): uygulamalar bütün izleri gönderir, saklanıp saklanmayacağına burada, izin
  # span'leri geldikten sonra karar verilir. Bir faturanın sorunlu olup olmadığı ancak denemeleri yapılınca belli olur;
  # karar bu yüzden uygulamada (ilk span'de) değil burada verilir. Bir faturanın bütün yolculuğu (oluşturma, denemeler,
  # ERP haberleri) tek trace'tir; karar bütün yolculuğa birlikte uygulanır.
  tail_sampling:
    # Bir trace'in ilk span'i geldikten sonra karar için beklenen süre. Sorunsuz bir faturanın oluşturulmasından
    # gönderilmesine (1. ya da 2. denemede) kadar geçen süreyi kapsamalı: o ana kadar 3. deneme gerekip gerekmediği belli
    # olur. Yükte bu süre kuyruk beklemesiyle uzar: saniyede 50 fatura 2 dakika gelir ve ERP isteklerin yarısından
    # fazlasına sorunlu cevap verirse saklanan sorunsuz izlerde en uzun 23,7 dk ölçüldü; 30 dk bunun üstünde pay bırakır.
    # Süre yetmezse fatura aşağıdaki ihtiyat kuralıyla saklanır: sorunlu fatura kaybolmaz, sorunsuz oranı %10'un üstüne
    # çıkar.
    # Bedeli bellek: bu süre boyunca gelen bütün span'ler Collector'da tutulur.
    decision_wait: 30m
    # Bellekte aynı anda tutulan en fazla trace; dolarsa en eskiler kararsız atılır. decision_wait boyunca oluşan bütün
    # trace'leri tutmalı: faturalar (2 dakikalık yükte 6000) ve worker'ların sorguları (her biri ayrı trace; sayıları
    # ölçülmedi). Varsayılanın (50.000) iki katı pay olarak seçildi.
    num_traces: 100000
    # Karar verilip bellekten çıkmış trace'lere sonradan gelen span'ler (geç gelen ERP haberleri, karar süresinden uzun
    # süren faturaların sonraki denemeleri) aynı karara uyar: saklanan faturanınki saklanır, atılanınki atılır. Kapalı
    # olsaydı geç span yeni bir trace gibi değerlendirilir, atılmış bir faturanın yalnız bir parçası saklanabilirdi.
    # num_traces'ten büyük olmalı ki kararlar span'lerden uzun hatırlansın.
    decision_cache:
      sampled_cache_size: 500000
      non_sampled_cache_size: 500000
    # Politikalardan biri "sakla" derse trace saklanır; hiçbiri demezse atılır. Fatura numarası (invoice.number)
    # taşımayan trace'ler hiçbir politikaya uymaz: worker'ların kuyruk ve diğer sorguları saklanmaz.
    policies:
      # 1) Kalıcı olarak Başarısız olan ve henüz gönderilmemiş faturalar: trace'te sonucu "Sent" olan bir deneme yoksa
      #    saklanır. Başarısız faturalar buraya girer. İhtiyat kuralı da budur: karar anında fatura henüz denenmemiş
      #    ya da denemesi sürüyorsa, ileride sorunlu çıkabileceği için saklanır.
      - name: gonderilmemis-ya-da-basarisiz
        type: and
        and:
          and_sub_policy:
            - name: fatura-izi
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span: ['attributes["invoice.number"] != nil']
            - name: gonderildi-yok
              type: string_attribute
              string_attribute: { key: outbox.outcome, values: [Sent], invert_match: true }
      # 2) En az 3 kez denenen faturalar: 3. ya da sonraki bir denemenin span'i varsa saklanır.
      - name: en-az-3-deneme
        type: numeric_attribute
        numeric_attribute: { key: outbox.attempt, min_value: 3 }
      # 3) Sorunsuz faturalar: 1. ya da 2. denemede gönderilen faturaların bu yüzdesi saklanır (trace ID'ye göre).
      - name: sorunsuz-ornek
        type: and
        and:
          and_sub_policy:
            - name: fatura-izi
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span: ['attributes["invoice.number"] != nil']
            - name: oran
              type: probabilistic
              probabilistic:
                # Saklanan sorunsuz fatura oranı, yüzde.
                sampling_percentage: 10

exporters:
  # Metrik adları uygulamaların eski /metrics çıktısıyla aynıdır (birim ve _total ekleri dahil), pano ve alarmlar
  # değişmeden çalışır. job etiketi service.name'dir (invoice-service, erp-simulator).
  prometheus:
    endpoint: 0.0.0.0:8889
    # Bir servisten bu kadar süre metrik gelmezse son değerleri sunulmaz (varsayılan 5 dakika). Kısa tutulur: servis
    # durunca metrikleri Prometheus'ta da kaybolsun ve MetrikToplanamiyor alarmı servisin durduğunu görebilsin.
    # Uygulamalar 5 sn'de bir gönderir; 15 sn, üç gönderimin kaçması demektir.
    metric_expiration: 15s

  # Saklanmasına karar verilen izler Jaeger'a gider. Jaeger compose ağında, TLS'siz.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [tail_sampling]
      exporters: [otlp/jaeger]
